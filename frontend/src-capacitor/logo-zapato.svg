<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shoeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="soleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Suela del zapato -->
  <path d="M 120 350 Q 100 370 120 390 L 380 390 Q 420 390 430 350 Q 435 330 420 320 L 140 320 Q 120 330 120 350 Z" 
        fill="url(#soleGradient)" stroke="#1f2937" stroke-width="3"/>
  
  <!-- Cuerpo del zapato -->
  <path d="M 140 320 Q 120 300 130 280 L 140 200 Q 150 160 180 140 L 300 140 Q 350 140 380 170 L 400 220 Q 420 280 420 320 L 140 320 Z" 
        fill="url(#shoeGradient)" stroke="#1e40af" stroke-width="3"/>
  
  <!-- Lengüeta -->
  <path d="M 200 140 Q 180 120 200 100 L 280 100 Q 300 120 280 140 L 200 140 Z" 
        fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Ojales para cordones -->
  <circle cx="220" cy="180" r="8" fill="#374151"/>
  <circle cx="260" cy="180" r="8" fill="#374151"/>
  <circle cx="230" cy="220" r="8" fill="#374151"/>
  <circle cx="250" cy="220" r="8" fill="#374151"/>
  <circle cx="240" cy="260" r="8" fill="#374151"/>
  
  <!-- Cordones -->
  <path d="M 220 180 Q 240 160 260 180" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M 230 220 Q 240 200 250 220" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M 240 260 Q 240 240 240 260" stroke="#ffffff" stroke-width="3" fill="none"/>
  
  <!-- Detalles decorativos -->
  <path d="M 160 200 Q 180 190 200 200" stroke="#dbeafe" stroke-width="2" fill="none"/>
  <path d="M 320 200 Q 340 190 360 200" stroke="#dbeafe" stroke-width="2" fill="none"/>
  
  <!-- Texto "JM" en el zapato -->
  <text x="256" y="250" font-family="Arial, sans-serif" font-size="40" font-weight="bold" 
        text-anchor="middle" fill="#ffffff" stroke="#1e40af" stroke-width="1">JM</text>
  
  <!-- Sombra -->
  <ellipse cx="280" cy="420" rx="150" ry="20" fill="#000000" opacity="0.2"/>
</svg>